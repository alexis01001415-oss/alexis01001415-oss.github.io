name: Verify site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_DEMO_MODE: 'true'
      PUBLIC_SITE_URL: https://alexis01001415-oss.github.io
      PUBLIC_WEB3FORMS_ACCESS_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test quotation rules
        run: npm test
      - name: Check types and build static site
        run: npm run build
